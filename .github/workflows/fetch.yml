name: fetch-assets
on:
  push:
    branches: [fetcher]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: media
      - name: Download listed files
        run: |
          git fetch origin fetcher --depth 1
          git show origin/fetcher:urls.txt > /tmp/urls.txt
          mkdir -p music
          while read -r name url; do [ -n "$name" ] && curl -sSL -o "music/$name" "$url"; done < /tmp/urls.txt
          ls -la music
          git config user.name "asset-fetcher"; git config user.email "asset-fetcher@users.noreply.github.com"
          git add music && git commit -m "Fetch music assets" && git push origin HEAD:media || echo "nothing new"
